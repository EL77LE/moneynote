name: MoneyNote
options:
  bundleIdPrefix: com.moneynote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  MoneyNote:
    type: application
    platform: iOS
    sources:
      - path: MoneyNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneynote.native
        PRODUCT_NAME: MoneyNote
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MoneyNote
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

schemes:
  MoneyNote:
    build:
      targets:
        MoneyNote: all
    run:
      config: Debug
