name: 安卓原生构建与录屏

on:
  workflow_dispatch:
    inputs:
      record_seconds:
        description: '录屏时长（秒，上限 180）'
        required: false
        default: '45'
      api_base_url:
        description: '云端后端地址。留空=只做模拟器演示；填 https 地址=额外得到能装手机的 APK'
        required: false
        default: ''

jobs:
  build-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 启动本机后端
        working-directory: backend
        run: |
          npm install
          npm run seed
          nohup npm start > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "后端已就绪"
              exit 0
            fi
            sleep 1
          done
          echo "后端 30 秒没起来，日志如下："
          cat /tmp/backend.log
          exit 1

      - name: 解析后端地址
        env:
          INPUT_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          API="$(printf '%s' "$INPUT_URL" | tr -d '[:space:]' | sed 's#/*$##')"
          if [ -z "$API" ]; then
            API="http://10.0.2.2:3000"
            echo "未填云端地址：正常 APK 只在模拟器可用"
          else
            case "$API" in
              https://*) ;;
              *)
                echo "云端地址必须以 https:// 开头，收到：$API"
                exit 1
                ;;
            esac
            echo "正常 APK 连接：$API"
          fi
          echo "API_BASE_URL=$API" >> "$GITHUB_ENV"

      - name: 构建正常 APK
        run: |
          gradle -p native/android assembleDebug -PapiBaseUrl="$API_BASE_URL"
          cp native/android/app/build/outputs/apk/debug/app-debug.apk moneynote-native.apk
          ls -lh moneynote-native.apk

      - name: 构建录屏演示 APK
        run: |
          # 演示版固定连模拟器本机后端，打开 DEMO_MODE。
          # 启动后自动：首页 → 记一笔 → 保存 → 统计 → 切月份。
          gradle -p native/android assembleDebug \
            -PapiBaseUrl=http://10.0.2.2:3000 \
            -PdemoMode=true
          cp native/android/app/build/outputs/apk/debug/app-debug.apk moneynote-native-demo.apk
          ls -lh moneynote-native-demo.apk

      - name: 启动安卓模拟器并录屏
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RECORD_SECONDS: ${{ github.event.inputs.record_seconds }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          # 注意：android-emulator-runner 会把 script 按行分别交给 sh -c 执行，
          # 多行的 if/then/fi 会在第一行就报 "end of file unexpected"，
          # 变量和后台 PID 也不会跨行保留。所以录屏逻辑必须写成单行，
          # 并让 screenrecord、启动 App、等待都在同一个 adb shell 会话里完成。
          script: |
            adb install -r moneynote-native-demo.apk
            adb shell "screenrecord --size 720x1280 --bit-rate 3000000 --time-limit 45 /sdcard/native-demo.mp4 & sleep 3; am start -W -n com.moneynote.nativeapp/.MainActivity; sleep 45"
            adb exec-out screencap -p > native-screenshot.png
            adb pull /sdcard/native-demo.mp4 native-demo.mp4
            ls -lh native-demo.mp4 native-screenshot.png

      - name: 后端日志
        if: always()
        run: |
          if [ -f /tmp/backend.log ]; then
            tail -n 80 /tmp/backend.log
          else
            echo "没有后端日志"
          fi

      - name: 上传录屏和截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-recording
          path: |
            native-demo.mp4
            native-screenshot.png
          retention-days: 30
          if-no-files-found: warn

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-apk
          path: moneynote-native.apk
          retention-days: 30
          if-no-files-found: warn
