# iOS 模拟器构建 + 录屏
#
# 用途：在没有 Mac 的情况下，证明 iOS 端真的能编译、能装、能跑，
#       并拿到一段 iOS 模拟器上的真实录屏。
#
# 怎么用：
#   1. 推到 GitHub（公开仓库，Actions 分钟数免费且不限量）
#   2. 仓库页 -> Actions -> 左边选「iOS 模拟器构建与录屏」-> Run workflow
#   3. 等 15~25 分钟，在运行页面底部 Artifacts 里下载录屏
#
# 原理：iOS 模拟器和它的宿主 macOS 共享网络栈，
#       所以在同一个 runner 上启动的后端，用 http://localhost:3000 就能连上，
#       正好就是 AppConfig 里 iOS 分支的默认地址，不用改任何代码。

name: iOS 模拟器构建与录屏

on:
  workflow_dispatch:
    inputs:
      record_seconds:
        description: '录屏时长（秒）'
        required: false
        default: '45'

jobs:
  build-and-record:
    # ⚠️ 这一行不是随便写的，改之前先看完这段。
    #
    # 原来这里是 `macos-14`，已经换掉了 —— 原因是一个**有截止日期的**问题：
    # GitHub 从 2026-07-06 开始弃用 macos-14 镜像，
    # **2026-11-02 之后彻底不支持**。到那天这个 label 会直接消失，
    # 工作流会在第一步就报"The macos-14 label is no longer supported"，
    # 而且报错和工作内容毫无关系，很难往镜像上想。
    #
    # 为什么不用 `macos-latest`：它现在指向 macos-26（Xcode 26.6），
    # 而且**会随时间漂移** —— 今天能跑，半年后 GitHub 把 latest 挪到下一个版本，
    # 就可能在你不改任何代码的情况下挂掉。我们在本机验证的是 Flutter 3.47.7，
    # 钉死镜像版本，是为了让"我验证过的东西"和"CI 上跑的东西"是同一个。
    # 同样的理由见 web-deploy.yml 里钉 Flutter 版本那段注释。
    #
    # 为什么是 15 而不是 14 或 latest：macos-15 是**当前仍受支持、又不是最新**
    # 的那一档（macOS 15.7.9，自带 Xcode 16.4 和 iOS 18.x 模拟器）。
    # 它离弃用还很远，Xcode 也不至于新到 Flutter 不认。
    #
    # ⚠️ 剩下的不确定性，说清楚：**Xcode 版本和 Flutter 3.47.7 兼不兼容，
    # 我没法在本地验证**（本机没有 macOS）。如果构建挂在 Xcode 相关的地方，
    # 就往这个方向查 —— 换 macos-26 或 macos-15 都试试，
    # GitHub 的报错里通常会直接写它用的是哪个 Xcode。
    runs-on: macos-15
    # 编译 + 模拟器 + 录屏，正常 20~30 分钟。超过 45 分钟基本是卡住了。
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          # 和 web-deploy.yml 一样钉死版本。理由见那边的注释：
          # 写 stable 意味着 CI 装的版本会随时间漂移，
          # 而你在本机验证过的是 3.47.7。
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Flutter 版本
        run: flutter --version

      - name: 安装后端依赖并生成演示数据
        working-directory: backend
        run: |
          npm install
          npm run seed

      - name: 后台启动后端
        working-directory: backend
        run: |
          nohup npm start > /tmp/backend.log 2>&1 &
          # 轮询等它就绪，比 sleep 固定秒数可靠
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "后端已就绪"
              exit 0
            fi
            sleep 1
          done
          echo "后端 30 秒内没起来，日志如下："
          cat /tmp/backend.log
          exit 1

      - name: 验证后端能返回中文数据
        run: |
          curl -fsS "http://localhost:3000/api/stats?month=$(date +%Y-%m)" | head -c 400
          echo

      - name: 安装 App 依赖
        working-directory: app
        run: flutter pub get

      - name: 静态检查
        working-directory: app
        run: flutter analyze

      - name: 跑单元测试
        working-directory: app
        run: flutter test

      - name: 决定录屏时长
        env:
          RECORD_SECONDS: ${{ github.event.inputs.record_seconds }}
        run: |
          DURATION="$RECORD_SECONDS"
          # 空值 / 非数字先兜底，否则后面比较会在 set -e 的语境里以
          # "integer expression expected" 这种看不懂的方式失败。
          if ! echo "$DURATION" | grep -Eq '^[0-9]+$'; then
            echo "录屏时长「$DURATION」不是数字，改用默认值 45"
            DURATION=45
          fi
          if [ "$DURATION" -gt 180 ]; then
            echo "录屏上限按 180 秒处理（再长视频文件会很大，GitHub 也不建议）"
            DURATION=180
          fi
          if [ "$DURATION" -lt 5 ]; then
            echo "录屏太短看不清，改成 5 秒"
            DURATION=5
          fi
          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "录屏时长：$DURATION 秒"

      - name: 启动 iOS 模拟器
        id: sim
        run: |
          # 挑第一个可用的 iPhone 机型
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')][0])")
          echo "模拟器 UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: 构建 iOS 模拟器版
        working-directory: app
        run: |
          # DEMO_MODE=true：App 启动后自动走一遍
          # 「首页 → 记一笔 → 保存 → 统计 → 切月份」，
          # 45 秒录屏里能看到真实功能，而不是只停在首页。
          # 正常安装包不会带这个 define。
          flutter build ios --simulator --debug \
            --dart-define=API_BASE_URL=http://localhost:3000 \
            --dart-define=DEMO_MODE=true

      - name: 安装到模拟器
        working-directory: app
        run: |
          APP_PATH=build/ios/iphonesimulator/Runner.app
          ls -la "$APP_PATH"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP_PATH"

          # 从产物里读 bundle id，比手写猜测的稳
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

      - name: 启动录屏
        run: |
          # ⚠️ 录屏必须在**安装完之后、启动 App 之前**开始。
          # 原来的顺序是先录屏再编译，结果 20 分钟编译等待全被录进了视频，
          # 真正有用的画面只剩最后几十秒。
          #
          # 必须把输出重定向到文件：GitHub Actions 要等这一步骤的 stdout
          # 关闭才算结束，而 recordVideo 是个长跑进程。不重定向的话，
          # 这个步骤会一直挂到录屏结束，后面的步骤根本不会开始。
          nohup xcrun simctl io "${{ steps.sim.outputs.udid }}" recordVideo --codec h264 /tmp/ios-demo.mp4 \
            > /tmp/rec.log 2>&1 &
          echo $! > /tmp/rec.pid
          sleep 3

      - name: 启动 App 并等待渲染
        run: |
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BUNDLE_ID"
          # 等它把后端数据拉回来并渲染完
          sleep "$DURATION"

      - name: 截图留档
        run: |
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot /tmp/ios-screenshot.png
          ls -la /tmp/ios-screenshot.png

      - name: 停止录屏
        if: always()
        run: |
          # 必须发 SIGINT，kill -9 会让 mp4 没有索引文件而无法播放。
          # 如果前面构建就失败了，这里根本没开始录 —— 不要因此再报一个错，
          # 把真正的失败原因盖掉。
          if [ -f /tmp/rec.pid ]; then
            kill -INT "$(cat /tmp/rec.pid)" || true
            sleep 3
            ls -la /tmp/ios-demo.mp4 || true
          else
            echo "没有开始录屏（前面的步骤可能已经失败），跳过。"
          fi

      - name: 后端日志
        if: always()
        run: |
          if [ -f /tmp/backend.log ]; then
            cat /tmp/backend.log
          else
            echo "没有后端日志（后端可能没起来）"
          fi

      - name: 上传录屏和截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-recording
          path: |
            /tmp/ios-demo.mp4
            /tmp/ios-screenshot.png
          retention-days: 30
          # 构建失败时没有产物，只警告、不再制造第二个红叉
          if-no-files-found: warn
